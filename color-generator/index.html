<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[1240px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 03</span>
      </header>

      <div class="flex flex-col justify-center py-10">
        <div class="flex justify-between">
          <div class="flex-col">
            <div class="text-[30px] text-[#F4F4F5]">Color palettes.</div>
            <div class="text-[14px] text-[#A1A1AA] mt-[14px]">Generated shades with Tailwind color names. Click a shade to copy its HEX background color.</div>
          </div>
          <button class="w-[186px] h-[48px] bg-[#D9F99D] text-[#09090B] rounded-xl text-[14px] ml-[434px] items-center flex justify-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#09090B"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-refresh-ccw preview-icon"
            >
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
            Shuffle palettes
          </button>
        </div>
        <div class="border-t border-zinc-800 mt-[20px]"></div>
        <div class="flex justify-between mt-[30px]">
          <div class="text-[#A1A1AA] text-[12px]">100 → 950 · LIGHT TO DARK</div>
          <div class="text-[#A1A1AA] text-[12px]">Ready to explore.</div>
        </div>
        <div class="text-[#E4E4E7] text-[14px] mt-[20px]">Red</div>
        <div class="space-y-7">
          <div class="mt-[12px] flex gap-3">
            <button class="flex flex-col items-center">
              <span class="bg-[#FDE3E3] w-[113px] h-[64px] rounded-xl"></span>
              <span class="text-[#D4D4D8] text-[12px] mt-2">100</span>
              <span class="text-[#A1A1AA] text-[9px] mt-[7px]">#09090B</span>
            </button>
            <button class="flex flex-col items-center">
              <span class="bg-[#FABDBD] w-[113px] h-[64px] rounded-xl"></span>
              <span class="text-[#D4D4D8] text-[12px] mt-2">200</span>
              <span class="text-[#A1A1AA] text-[9px] mt-[7px]">#FABDBD</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
