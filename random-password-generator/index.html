<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="bg-[#101B16] flex items-center justify-center h-screen">
    <div
      class="w-[520px] h-[571px] bg-[#192B22] rounded-xl border border-[#FFFFFF1A] p-9 flex flex-col"
    >
      <div
        class="h-[44px] w-[44px] bg-[#4ADE8026] rounded-xl flex items-center justify-center"
      >
        <div class="">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#86EFAC"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-lock-keyhole preview-icon"
          >
            <circle cx="12" cy="16" r="1" />
            <rect x="3" y="10" width="18" height="12" rx="2" />
            <path d="M7 10V7a5 5 0 0 1 10 0v3" />
          </svg>
        </div>
      </div>
      <div class="text-[#F0FDF4] text-[28px] mt-6">Password generator</div>
      <div class="text-[#A4B9AD] text-[14px] mt-2">
        A strong password. One click away.
      </div>
      <div class="mt-8 text-[#A4B9AD] text-[12px]">Your password</div>
    </div>
  </body>
</html>
