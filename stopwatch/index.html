<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65">The everyday collection / 04</span>
      </header>

      <div class="flex flex-col items-center justify-center py-10 h-[1000px]">
        <div class="h-[590px] w-[620px] border border-[#FFFFFF26] bg-[#19231E8C] rounded-xl p-10">
          <div class="flex justify-between">
            <div class="h-11 w-11 flex justify-center items-center rounded-xl bg-[#B5CBB21A]">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#C5D9BD"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-alarm-clock preview-icon"
              >
                <circle cx="12" cy="13" r="8" />
                <path d="M12 9v4l2 2" />
                <path d="M5 3 2 6" />
                <path d="m22 6-3-3" />
                <path d="M6.38 18.7 4 21" />
                <path d="M17.64 18.67 20 21" />
              </svg>
            </div>
            <div id="state" class="h-[29px] w-[62px] rounded-xl flex items-center justify-center bg-[#B5CBB20D] text-[#C5D9BD] text-[12px] border border-[#C5D9BD26] cursor-pointer">Ready</div>
          </div>
          <div class="text-[40px] text-[#F0FDF4] mt-7">Stopwatch</div>
          <div class="text-[14px] text-[#A4B9AD] mt-2">Make time for what matters.</div>
          <div class="border-t-[0.5px] border[#B5CBB226] mt-9"></div>
          <div class="flex mt-9 justify-between">
            <div class="ml-[90px]">
              <div id="hours" class="text-[56px] text-[#EDF3E8] w-[66px]">00</div>
              <div class="text-[9px] text-[#9BAD9E] text-center">HOURS</div>
            </div>
            <div class="text-[#5C7161] text-[40px] mt-2">:</div>
            <div>
              <div id="minutes" class="text-[56px] text-[#EDF3E8] w-[66px]">00</div>
              <div class="text-[9px] text-[#9BAD9E] text-center">MINUTES</div>
            </div>
            <div class="text-[#5C7161] text-[40px] mt-2">:</div>
            <div class="mr-[90px]">
              <div id="seconds" class="text-[56px] text-[#EDF3E8] w-[66px]">00</div>
              <div class="text-[9px] text-[#9BAD9E] text-center">SECONDS</div>
            </div>
          </div>
          <div class="border-t-[0.5px] border[#B5CBB226] mt-9"></div>
          <div class="flex gap-3 mt-[47px]">
            <button id="start-button" class="cursor-pointer h-12 w-[258px] rounded-xl bg-[#B5CBB2] text-[#102418] text-[14px] disabled:cursor-not-allowed disabled:opacity-35">Start</button>
            <button disabled id="stop-button" class="cursor-pointer h-12 w-[129px] rounded-xl ] text-[#DCECE2s] text-[14px border border-[#FFFFFF1A] disabled:cursor-not-allowed disabled:opacity-35">
              Pause
            </button>
            <button disabled id="reset-button" class="cursor-pointer h-12 w-[129px] rounded-xl text-[#A4B9AD] text-[14px border border-[#FFFFFF1A] disabled:cursor-not-allowed disabled:opacity-35">
              Reset
            </button>
          </div>
          <div class="mt-5 text-[#8AA294] text-[12px] text-center">A moment of focus. At your own pace.</div>
        </div>
      </div>
    </div>
  </body>
</html>
